name: attendiqo
description: Attendiqo management and attendance application by HamdhyTech.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  attendiqo_shared:
    path: ../../packages/attendiqo_shared
  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  cloud_functions: ^6.0.0
  permission_handler: ^12.0.1
  http: ^1.2.2
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
